name: Release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - name: Verify distribution
        run: node scripts/packed-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-distribution
          path: |
            .tmp/releases/*.tgz
            .tmp/releases/package-manifest.json
      - name: Publish to npm using OIDC
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: npm run release:publish
