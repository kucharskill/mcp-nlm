[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-nlm"
version = "0.1.0"
description = "On-demand stdio proxy for the latest NotebookLM MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kucharskill" }]
keywords = ["mcp", "notebooklm", "stdio", "proxy"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/kucharskill/mcp-nlm"
Repository = "https://github.com/kucharskill/mcp-nlm"
Issues = "https://github.com/kucharskill/mcp-nlm/issues"

[project.scripts]
mcp-nlm = "mcp_nlm:main"

[tool.hatch.build.targets.sdist]
only-include = ["src/mcp_nlm", "cli.js", "proxy.js", "package.json", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_nlm"]

[tool.hatch.build.targets.wheel.force-include]
"cli.js" = "mcp_nlm/runtime/cli.js"
"proxy.js" = "mcp_nlm/runtime/proxy.js"
"package.json" = "mcp_nlm/runtime/package.json"
